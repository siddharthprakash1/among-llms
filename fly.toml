app = "CHANGE-ME"
primary_region = "CHANGE-ME"

[env]
  ARENA_IP_HEADER = "fly-client-ip"
  ARENA_RATE_LIMIT = "6"
  ARENA_DAILY_GAMES = "2000"
  ARENA_MAX_GAMES = "4"
  ARENA_MAX_TOURNAMENTS = "1"

[mounts]
  source = "arena_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"      # live games and tournaments live in this process
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500              # bounds open SSE streams without app code

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
